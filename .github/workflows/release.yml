name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `builderArgs` pins the architecture explicitly: if a runner label ever
        # starts pointing at the other architecture, the build fails instead of
        # silently shipping mis-architected artifacts (which would also clobber
        # same-named assets of the other architecture).
        # `macos-latest` is macOS 26 arm64; `macos-26-intel` is the standard
        # GitHub-hosted macOS 26 x64 (Intel) runner.
        include:
          - os: macos-latest
            builderArgs: --mac --arm64
          - os: macos-26-intel
            builderArgs: --mac --x64
          - os: ubuntu-latest
            builderArgs: ""
          - os: windows-latest
            builderArgs: ""
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: pnpm run build && npx electron-builder --publish always ${{ matrix.builderArgs }}

      # The remote backend zip is platform-independent (pure Node bundle, no
      # node_modules inside — better-sqlite3 is installed at deploy time), so a
      # single build on Linux serves every platform.
      - name: Build remote backend
        if: runner.os == 'Linux'
        run: pnpm run build:remote

      - name: Upload remote backend zip to release
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          zip="dist/imboss-backend-${version}.zip"
          if [ ! -f "$zip" ]; then
            echo "expected remote backend zip at $zip" >&2
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            # workflow_dispatch: electron-builder publishes under v<version>.
            tag="v${version}"
          fi
          gh release upload "$tag" "$zip" --clobber
